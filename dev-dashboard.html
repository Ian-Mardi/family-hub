<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Hub Developer Console</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#101828;color:white;padding:22px 30px;display:flex;justify-content:space-between;align-items:center}header small{opacity:.7}.shell{max-width:1180px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat,.panel{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:20px;box-shadow:0 2px 8px #00000006}.stat strong{display:block;font-size:28px;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel h2{font-size:18px;margin:0 0 14px}.item{border:1px solid #e7eaf0;border-radius:12px;padding:13px;margin:9px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#667085;font-size:13px}.btn{border:0;background:#172033;color:white;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.secondary{background:#e9eef8;color:#172033}.btn.approve{background:#198754}.btn.reject{background:#b42318}.empty{padding:20px;color:#667085}.family-detail{margin-top:18px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail-grid div{background:#f4f6fa;border-radius:10px;padding:10px}.detail-grid strong{display:block;font-size:20px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee;vertical-align:top}.scroll{overflow:auto}.hide{display:none}input{padding:9px;border:1px solid #d0d5dd;border-radius:8px;max-width:100%}@media(max-width:800px){.layout,.stats{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}header{padding:18px}}
</style></head><body><header><div><b>Family Hub · Developer</b><br><small>LOCAL CONSOLE · 127.0.0.1 ONLY</small></div><button class="btn secondary" onclick="load()">Refresh</button></header><main class="shell"><section class="stats"><div class="stat">Families<strong id="famcount">—</strong></div><div class="stat">Requests<strong id="reqcount">—</strong></div><div class="stat">Pending<strong id="pendcount">—</strong></div></section><div class="layout"><section class="panel"><h2>Family workspaces</h2><div id="families">Loading...</div></section><section class="panel"><h2>Access requests</h2><div id="requests">Loading...</div></section></div><section class="panel family-detail hide" id="detail"></section></main><script>
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const d=await api('overview');document.getElementById('famcount').textContent=d.families.length;document.getElementById('reqcount').textContent=d.requests.length;document.getElementById('pendcount').textContent=d.requests.filter(x=>x.status==='pending').length;document.getElementById('families').innerHTML=d.families.length?d.families.map(f=>`<div class="item"><div><b>${esc(f.name)}</b><div class="muted">${f.members} members · ${esc(f.id)}</div></div><button class="btn" onclick="openFamily('${esc(f.id)}')">Inspect</button></div>`).join(''):'<div class="empty">No families yet.</div>';document.getElementById('requests').innerHTML=d.requests.length?d.requests.map(r=>`<div class="item"><div><b>${esc(r.family_name)}</b><div class="muted">${esc(r.contact_name)} · ${esc(r.email)}<br>${esc(r.status)}</div></div><div>${r.status==='pending'?`<button class="btn approve" onclick="status('${esc(r.id)}','approved')">Approve</button> <button class="btn reject" onclick="status('${esc(r.id)}','rejected')">Reject</button>`:`<button class="btn secondary" onclick="status('${esc(r.id)}','pending')">Reopen</button>`}</div></div>`).join(''):'<div class="empty">No signup requests.</div>'}catch(e){document.getElementById('families').textContent='Error: '+e.message;document.getElementById('requests').textContent='Error: '+e.message}}
async function status(id,s){try{await api('request-status',{id,status:s});load()}catch(e){alert(e.message)}}
async function openFamily(id){try{let d=await api('family',{id});let f=d.family;let panel=document.getElementById('detail');panel.classList.remove('hide');panel.innerHTML=`<h2>Inspect family</h2><div><label>Family name</label> <input id="name" value="${esc(f.name)}"><button class="btn" onclick="rename('${esc(f.id)}')">Save name</button></div><p class="muted">ID: ${esc(f.id)}</p><div class="detail-grid"><div>Members<strong>${d.members.length}</strong></div><div>Tasks<strong>${d.tasks.length}</strong></div><div>Events<strong>${d.events.length}</strong></div><div>Conversations<strong>${d.conversations.length}</strong></div></div><h3>Members</h3><div class="scroll"><table><tr><th>Display name</th><th>User ID</th></tr>${d.members.map(m=>`<tr><td>${esc(m.display_name||'—')}</td><td>${esc(m.user_id||m.id)}</td></tr>`).join('')}</table></div><h3>Tasks</h3><div class="scroll"><table><tr><th>Title</th><th>Status</th><th>Assigned</th></tr>${d.tasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.completed_at?'Complete':'Active')}</td><td>${esc(t.assigned_to||'—')}</td></tr>`).join('')}</table></div><h3>Events</h3><div class="scroll"><table><tr><th>Title</th><th>Date</th></tr>${d.events.map(e=>`<tr><td>${esc(e.title)}</td><td>${esc(e.starts_at||'')}</td></tr>`).join('')}</table></div>`;panel.scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}}
async function rename(id){try{await api('rename',{id,name:document.getElementById('name').value});alert('Saved');load()}catch(e){alert(e.message)}}load();
</script></body></html>
